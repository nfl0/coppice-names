[workspace]
resolver = "2"
members = ["crates/coppice-names", "crates/coppice-names-wallet"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/nfl0/coppice-names"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }

[workspace.dependencies]
coppice = { package = "coppice", git = "https://github.com/nfl0/coppice.git", rev = "eb7e2c926f5deab313a571217857d582c4275082" }
coppice-names = { package = "coppice-names", path = "crates/coppice-names" }
anyhow = "1"
blake2b_simd = "1"
halo2_gadgets = { package = "zakura-halo2-gadgets", version = "=1.0.0", default-features = false }
hex = "0.4"
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }
orchard = { package = "zakura-orchard", version = "=1.0.0", features = ["std", "state-note"] }
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0" }
rand_chacha = "0.10"
rand = "0.10"
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shardtree = "0.7"
subtle = "2.6"
# Keep the address parser on the same released package/type family used by
# coppice-wallet and zcash-devtool. The Zakura forks do not alter this parser.
zcash_address = "0.13.0"
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc4" }
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0", features = ["std"] }
zcash_protocol = { version = "=0.10.5", features = ["std", "local-consensus"] }
zeroize = "1"
pczt = { package = "zakura-pczt", version = "=0.1.0-rc2", features = ["io-finalizer", "orchard", "prover", "signer", "spend-finalizer", "tx-extractor", "zcp-builder"] }

[patch.crates-io]
# Replace the released Zakura Orchard package with the Coppice extension while
# retaining one package/type family across Coppice Core and Names.
zakura-orchard = { git = "https://github.com/nfl0/orchard-coppice.git", rev = "e702d0525d5086d41b66ab870ede0a94b05fdcae" }

[package]
name = "coppice-names"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/nfl0/coppice-names"
publish = false

[lints]
workspace = true

[dependencies]
blake2b_simd = "1"
coppice.workspace = true
halo2_gadgets = { workspace = true }
hex = "0.4"
orchard = { workspace = true, features = ["std", "state-note"] }
pasta_curves = { workspace = true }
rand_core = { workspace = true }
serde = { version = "1", features = ["derive"] }
zcash_address.workspace = true

[dev-dependencies]
rand_chacha.workspace = true
serde_json.workspace = true
sha2.workspace = true
zcash_protocol.workspace = true

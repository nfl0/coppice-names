[package]
name = "coppice-names"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nfl0/coppice-names"
publish = false

[lints]
workspace = true

[dependencies]
blake2b_simd = "1"
coppice.workspace = true
halo2_gadgets = { version = "0.5", default-features = false }
halo2_proofs = "=0.3.2"
hex = "0.4"
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }
orchard = { version = "0.15.0", features = ["std", "experimental-state-note"] }
pasta_curves = "0.5"
rand_chacha = "0.3"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard.workspace = true
sha2 = "0.10"
shardtree = "0.7"
zcash_note_encryption = "0.4.1"
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "6c07e5f3297febf469e5cc8d0b91321e0767cdd7" }
zcash_primitives = { version = "=0.30.0", features = ["std"] }
zcash_protocol = { version = "=0.10.3", features = ["std", "local-consensus"] }

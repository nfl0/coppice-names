[package]
name = "coppice-names"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nfl0/coppice-names"
publish = false

[lints]
workspace = true

[dependencies]
blake2b_simd = "1"
coppice.workspace = true
halo2_gadgets = { version = "0.5", default-features = false }
halo2_proofs = "=0.3.2"
hex = "0.4"
orchard = { version = "0.15.0", features = ["std", "state-note"] }
pasta_curves = "0.5"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard.workspace = true
sha2 = "0.10"
